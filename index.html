<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Results Portal</title><style>*{box-sizing:border-box}body{--main:#087354;--accent:#e4a411;--soft:#edf7f3;--page:#eef7f4;margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--page);color:#173f36}body.is{--main:#136da4;--soft:#edf5fb;--page:#eff6fa}header{min-height:310px;background:linear-gradient(115deg,var(--main),color-mix(in srgb,var(--main),white 20%));color:#fff;padding:65px 20px 120px;text-align:center}header h1{font-size:44px;margin:15px 0}header p{font-size:19px;font-weight:bold}.wrap{max-width:1180px;margin:auto}.filters,.content{background:#fff;border-radius:28px;box-shadow:0 20px 48px #1c4f4226;padding:28px}.filters{margin:-80px 15px 18px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.content{margin:0 15px 90px;min-height:310px}label{display:block;font-weight:bold;margin-bottom:7px}select{width:100%;height:54px;border:1px solid #d8e6e2;border-radius:13px;padding:0 12px;background:#fbfdfc}.empty{min-height:250px;display:grid;place-items:center;text-align:center;color:#788b85}.head{display:flex;justify-content:space-between;align-items:center}.badge{background:var(--soft);color:var(--main);padding:8px 12px;border-radius:99px}.files{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:22px}.list button{width:100%;text-align:left;padding:16px;border:1px solid #dce9e5;background:#fff;border-radius:13px;margin-bottom:10px}.list button.active{border-color:var(--main);background:var(--soft)}.viewer{border:1px solid #dce9e5;border-radius:14px;overflow:hidden}.bar{padding:13px;display:flex;justify-content:space-between}.bar a{background:var(--main);color:#fff;padding:9px 13px;border-radius:9px;text-decoration:none}iframe{width:100%;height:62vh;min-height:480px;border:0;background:#eef2f1}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.files{grid-template-columns:1fr}}@media(max-width:540px){header h1{font-size:29px}.filters{grid-template-columns:1fr}}</style></head><body><header><h1>Course Results and Survey Portal</h1><p>Academic year 2025–2026</p></header><main class="wrap"><section class="filters"><div><label>Academic Year</label><select id="y"></select></div><div><label>Program</label><select id="p" disabled></select></div><div><label>Level</label><select id="l" disabled></select></div><div><label>Semester / Group</label><select id="g" disabled></select></div><div><label>Course</label><select id="c" disabled></select></div></section><section class="content"><div id="empty" class="empty"><h2>Choose the academic year and course</h2></div><div id="details" hidden><div class="head"><div><h2 id="title"></h2><span id="code"></span></div><span id="badge" class="badge"></span></div><div class="files"><div id="list" class="list"></div><div class="viewer"><div class="bar"><strong id="ft"></strong><a id="open" target="_blank">Open PDF</a></div><iframe id="view"></iframe></div></div></div></section></main><script src="data.js"></script><script>const q=x=>document.getElementById(x),Y=q('y'),P=q('p'),L=q('l'),G=q('g'),C=q('c'),u=a=>[...new Set(a)].sort();function fill(e,a,t){e.innerHTML=`<option value="">${t}</option>`;a.forEach(v=>e.add(new Option(v,v)));e.disabled=false}function reset(e,t){e.innerHTML=`<option value="">${t}</option>`;e.disabled=true}function hide(){q('empty').hidden=false;q('details').hidden=true}fill(Y,u(COURSES.map(x=>x.year)),'Choose year');reset(P,'Choose year first');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');Y.onchange=()=>{reset(P,'Choose year first');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(Y.value)fill(P,u(COURSES.filter(x=>x.year===Y.value).map(x=>x.program)),'Choose program')};P.onchange=()=>{document.body.className=P.value==='Information Systems'?'is':'';reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(P.value)fill(L,u(COURSES.filter(x=>x.year===Y.value&&x.program===P.value).map(x=>x.level)),'Choose level')};L.onchange=()=>{reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(L.value)fill(G,u(COURSES.filter(x=>x.year===Y.value&&x.program===P.value&&x.level===L.value).map(x=>x.group)),'Choose semester')};G.onchange=()=>{reset(C,'Choose semester first');hide();if(G.value){let a=COURSES.filter(x=>x.year===Y.value&&x.program===P.value&&x.level===L.value&&x.group===G.value);C.innerHTML='<option value="">Choose course</option>';a.forEach(x=>C.add(new Option(`${x.code} - ${x.name}`,x.code)));C.disabled=false}};C.onchange=()=>{if(!C.value)return hide();let x=COURSES.find(x=>x.year===Y.value&&x.program===P.value&&x.level===L.value&&x.group===G.value&&x.code===C.value);show(x)};function slug(s){return s.toLowerCase().replaceAll(' ','-')}function show(x){q('empty').hidden=true;q('details').hidden=false;q('title').textContent=x.name;q('code').textContent=x.code;q('badge').textContent=`${x.program} • ${x.level} • ${x.group}`;let root=`pdfs/${x.year}/${slug(x.program)}/${x.code.toLowerCase()}`;q('list').innerHTML='';[['Course Results','course-results.pdf'],['Course Survey','course-survey.pdf']].forEach((f,i)=>{let b=document.createElement('button');b.innerHTML=`<strong>📄 ${f[0]}</strong><br><small>${f[1]}</small>`;b.onclick=()=>openf(root+'/'+f[1],f[0],b);q('list').appendChild(b);if(!i)openf(root+'/'+f[1],f[0],b)})}function openf(url,t,b){document.querySelectorAll('.list button').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('ft').textContent=t;q('open').href=url;q('view').src=url+'#toolbar=1&navpanes=0'}</script></body></html>
