<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Results Portal</title><style>
*{box-sizing:border-box}body{--main:#17365d;--accent:#2878c7;--soft:#e4f0fd;--page:#f2f7fd;margin:0;font-family:Arial,sans-serif;background:var(--page);color:#16324f;transition:.3s}body.cs-theme{--main:#176b3a;--accent:#218c4f;--soft:#dff3e6;--page:#effaf3}body.is-theme{--main:#17365d;--accent:#2878c7;--soft:#e4f0fd;--page:#f2f7fd}header{background:var(--main);color:#fff;padding:24px;transition:.3s}.wrap{max-width:1180px;margin:auto}h1{margin:0 0 7px}.panel{background:#fff;border:2px solid var(--soft);border-radius:18px;padding:20px;margin-top:24px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}select{width:100%;height:48px;border:2px solid var(--soft);border-radius:11px;padding:0 11px;background:#fff}.empty{min-height:330px;display:grid;place-items:center;text-align:center}.course-head{display:flex;justify-content:space-between;align-items:center}.badge{background:var(--soft);color:var(--main);border-radius:99px;padding:7px 11px}.files{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:18px}.file-list button{width:100%;text-align:left;border:1px solid #dce5ee;background:#fff;padding:15px;border-radius:12px;margin-bottom:10px;cursor:pointer}.file-list button.active{border-color:var(--accent);background:var(--soft)}.viewer{border:1px solid #dce5ee;border-radius:13px;overflow:hidden}.viewerbar{display:flex;justify-content:space-between;padding:12px}.viewerbar a{background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;padding:8px 12px}iframe{width:100%;height:65vh;min-height:500px;border:0;background:#eef2f6}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.files{grid-template-columns:1fr}}@media(max-width:520px){.filters{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><h1>Course Results and Survey Portal</h1><p>Choose the program, level, semester or elective group, then the course.</p></div></header><main class="wrap"><section class="panel filters"><div><label>Program</label><select id="program"><option value="">Choose program</option></select></div><div><label>Level</label><select id="level" disabled></select></div><div><label>Semester / Group</label><select id="group" disabled></select></div><div><label>Course</label><select id="course" disabled></select></div></section><section class="panel"><div id="empty" class="empty"><h2>Course files will appear here</h2></div><div id="content" hidden><div class="course-head"><div><h2 id="title"></h2><span id="subtitle"></span></div><span id="badge" class="badge"></span></div><div class="files"><div id="fileList" class="file-list"></div><div class="viewer"><div class="viewerbar"><strong id="fileTitle"></strong><a id="open" target="_blank">Open PDF</a></div><iframe id="viewer"></iframe></div></div></div></section></main><script src="data.js"></script><script>
const $=id=>document.getElementById(id),P=$('program'),L=$('level'),G=$('group'),C=$('course'),uniq=a=>[...new Set(a)].sort();function fill(e,a,t){e.innerHTML=`<option value="">${t}</option>`;a.forEach(v=>e.add(new Option(v,v)));e.disabled=false}function reset(e,t){e.innerHTML=`<option value="">${t}</option>`;e.disabled=true}fill(P,uniq(COURSES.map(x=>x.program)),'Choose program');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');P.onchange=()=>{document.body.classList.remove('cs-theme','is-theme');if(P.value==='Computer Science')document.body.classList.add('cs-theme');if(P.value==='Information Systems')document.body.classList.add('is-theme');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(P.value)fill(L,uniq(COURSES.filter(x=>x.program===P.value).map(x=>x.level)),'Choose level')};L.onchange=()=>{reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(L.value)fill(G,uniq(COURSES.filter(x=>x.program===P.value&&x.level===L.value).map(x=>x.group)),'Choose semester / group')};G.onchange=()=>{reset(C,'Choose semester first');hide();if(G.value){let a=COURSES.filter(x=>x.program===P.value&&x.level===L.value&&x.group===G.value);C.innerHTML='<option value="">Choose course</option>';a.forEach(x=>C.add(new Option(`${x.code} - ${x.name}`,x.code)));C.disabled=false}};C.onchange=()=>{if(!C.value)return hide();show(COURSES.find(x=>x.program===P.value&&x.code===C.value))};function hide(){$('empty').hidden=false;$('content').hidden=true}function slug(s){return s.toLowerCase().replaceAll(' ','-')}function show(x){$('empty').hidden=true;$('content').hidden=false;$('title').textContent=x.name;$('subtitle').textContent=x.code;$('badge').textContent=`${x.program} • ${x.level} • ${x.group}`;let root=x.level==='Level 2'&&x.group==='Elective Courses'?`pdfs/shared/level-2-electives/${x.code.toLowerCase()}`:`pdfs/${slug(x.program)}/${x.code.toLowerCase()}`;$('fileList').innerHTML='';[['Course Results','course-results.pdf'],['Course Survey','course-survey.pdf']].forEach((f,i)=>{let b=document.createElement('button');b.innerHTML=`<strong>📄 ${f[0]}</strong><br><small>${f[1]}</small>`;b.onclick=()=>openf(root+'/'+f[1],f[0],b);$('fileList').appendChild(b);if(!i)openf(root+'/'+f[1],f[0],b)})}function openf(u,t,b){document.querySelectorAll('.file-list button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('fileTitle').textContent=t;$('open').href=u;$('viewer').src=u+'#toolbar=1&navpanes=0'}
</script></body></html>
