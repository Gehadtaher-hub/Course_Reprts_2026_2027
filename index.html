<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Results Portal</title><style>
*{box-sizing:border-box}body{--main:#087354;--accent:#e4a411;--soft:#edf7f3;--page:#eef7f4;margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--page);color:#173f36;transition:.3s}body.cs-theme{--main:#087354;--accent:#e4a411;--soft:#edf7f3;--page:#eef7f4}body.is-theme{--main:#136da4;--accent:#e4a411;--soft:#edf5fb;--page:#eff6fa}header{position:relative;overflow:hidden;min-height:340px;background:linear-gradient(115deg,var(--main),#149174);color:#fff;padding:58px 24px 130px;text-align:center;transition:.3s}body.is-theme header{background:linear-gradient(115deg,#0c5f91,#2588bd)}header:before,header:after{content:"";position:absolute;border-radius:50%;border:65px solid rgba(255,255,255,.06);width:330px;height:330px}header:before{left:-120px;top:-105px}header:after{right:-120px;bottom:-200px}.wrap{max-width:1180px;margin:auto}header h1{position:relative;margin:25px 0 18px;font-size:48px;font-weight:800;letter-spacing:.2px}header p{position:relative;margin:0;font-size:20px;font-weight:700}.panel{position:relative;background:#fff;border:1px solid #dce9e5;border-radius:28px;padding:30px;box-shadow:0 20px 48px rgba(28,79,66,.15)}.panel.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:-84px auto 18px;z-index:2}.panel:not(.filters){margin:0 auto 120px;z-index:1}label{display:block;font-weight:700;font-size:15px;margin-bottom:9px;color:#21483f}select{width:100%;height:58px;border:1px solid #d8e6e2;border-radius:13px;padding:0 14px;background:#fbfdfc;font-size:14px;color:#183f36;outline:none}select:focus{border-color:var(--main);box-shadow:0 0 0 3px var(--soft)}select:disabled{background:#f4f7f6;color:#8c9a96}.empty{min-height:300px;border-top:1px solid #e4ece9;display:grid;place-items:center;text-align:center;color:#798b86}.empty h2{color:#204b40}.course-head{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e4ece9;padding-top:24px}.badge{background:var(--soft);color:var(--main);border-radius:99px;padding:9px 13px;font-weight:700}.files{display:grid;grid-template-columns:230px 1fr;gap:20px;margin-top:22px}.file-list button{width:100%;text-align:left;border:1px solid #dce9e5;background:#fbfdfc;padding:17px;border-radius:14px;margin-bottom:11px;cursor:pointer;color:#21483f}.file-list button:before{content:"";display:block;width:44px;height:5px;background:var(--accent);border-radius:99px;margin-bottom:11px}.file-list button.active{border-color:var(--main);background:var(--soft)}.viewer{border:1px solid #dce9e5;border-radius:15px;overflow:hidden}.viewerbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.viewerbar a{background:var(--main);color:#fff;text-decoration:none;border-radius:10px;padding:10px 15px;font-weight:700}iframe{width:100%;height:65vh;min-height:500px;border:0;background:#eef2f1}@media(max-width:850px){header h1{font-size:35px}.filters{grid-template-columns:1fr 1fr}.files{grid-template-columns:1fr}.panel.filters{margin-left:15px;margin-right:15px}.panel:not(.filters){margin-left:15px;margin-right:15px}}@media(max-width:520px){.filters{grid-template-columns:1fr}header{min-height:290px}header h1{font-size:28px}.panel.filters{margin-top:-65px;padding:20px}.panel:not(.filters){padding:20px}}
</style></head><body><header><div class="wrap"><h1>Course Results and Survey Portal</h1><p>Academic Year 2026–2027</p></div></header><main class="wrap"><section class="panel filters"><div><label>Program</label><select id="program"><option value="">Choose program</option></select></div><div><label>Level</label><select id="level" disabled></select></div><div><label>Semester / Group</label><select id="group" disabled></select></div><div><label>Course</label><select id="course" disabled></select></div></section><section class="panel"><div id="empty" class="empty"><h2>Course files will appear here</h2></div><div id="content" hidden><div class="course-head"><div><h2 id="title"></h2><span id="subtitle"></span></div><span id="badge" class="badge"></span></div><div class="files"><div id="fileList" class="file-list"></div><div class="viewer"><div class="viewerbar"><strong id="fileTitle"></strong><a id="open" target="_blank">Open PDF</a></div><iframe id="viewer"></iframe></div></div></div></section></main><script src="data.js"></script><script>
const $=id=>document.getElementById(id),P=$('program'),L=$('level'),G=$('group'),C=$('course'),uniq=a=>[...new Set(a)].sort();function fill(e,a,t){e.innerHTML=`<option value="">${t}</option>`;a.forEach(v=>e.add(new Option(v,v)));e.disabled=false}function reset(e,t){e.innerHTML=`<option value="">${t}</option>`;e.disabled=true}fill(P,uniq(COURSES.map(x=>x.program)),'Choose program');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');P.onchange=()=>{document.body.classList.remove('cs-theme','is-theme');if(P.value==='Computer Science')document.body.classList.add('cs-theme');if(P.value==='Information Systems')document.body.classList.add('is-theme');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(P.value)fill(L,uniq(COURSES.filter(x=>x.program===P.value).map(x=>x.level)),'Choose level')};L.onchange=()=>{reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(L.value)fill(G,uniq(COURSES.filter(x=>x.program===P.value&&x.level===L.value).map(x=>x.group)),'Choose semester / group')};G.onchange=()=>{reset(C,'Choose semester first');hide();if(G.value){let a=COURSES.filter(x=>x.program===P.value&&x.level===L.value&&x.group===G.value);C.innerHTML='<option value="">Choose course</option>';a.forEach(x=>C.add(new Option(`${x.code} - ${x.name}`,x.code)));C.disabled=false}};C.onchange=()=>{if(!C.value)return hide();show(COURSES.find(x=>x.program===P.value&&x.code===C.value))};function hide(){$('empty').hidden=false;$('content').hidden=true}function slug(s){return s.toLowerCase().replaceAll(' ','-')}function show(x){$('empty').hidden=true;$('content').hidden=false;$('title').textContent=x.name;$('subtitle').textContent=x.code;$('badge').textContent=`${x.program} • ${x.level} • ${x.group}`;let root=x.level==='Level 2'&&x.group==='Elective Courses'?`pdfs/shared/level-2-electives/${x.code.toLowerCase()}`:`pdfs/${slug(x.program)}/${x.code.toLowerCase()}`;$('fileList').innerHTML='';[['Course Results','course-results.pdf'],['Course Survey','course-survey.pdf']].forEach((f,i)=>{let b=document.createElement('button');b.innerHTML=`<strong>📄 ${f[0]}</strong><br><small>${f[1]}</small>`;b.onclick=()=>openf(root+'/'+f[1],f[0],b);$('fileList').appendChild(b);if(!i)openf(root+'/'+f[1],f[0],b)})}function openf(u,t,b){document.querySelectorAll('.file-list button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('fileTitle').textContent=t;$('open').href=u;$('viewer').src=u+'#toolbar=1&navpanes=0'}
</script></body></html>
