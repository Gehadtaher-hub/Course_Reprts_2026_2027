<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة نتائج واستبيانات المقررات الدراسية</title>
<style>
*{box-sizing:border-box}body{--main:#24344d;--main2:#41546f;--accent:#d7ab32;--soft:#edf1f6;--page:#f4f6fa;margin:0;font-family:"Times New Roman",Times,serif;background:var(--page);color:#1d2939;transition:.3s}body.cs-theme{--main:#087354;--main2:#15936f;--soft:#e8f5f0;--page:#eef8f4}body.is-theme{--main:#126b9c;--main2:#2789b9;--soft:#e6f2fa;--page:#eff7fb}header{position:relative;min-height:380px;padding:28px 20px 130px;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;overflow:hidden;transition:.3s}header:before,header:after{content:"";position:absolute;width:320px;height:320px;border:60px solid rgba(255,255,255,.055);border-radius:50%}header:before{right:-130px;top:-170px}header:after{left:-140px;bottom:-220px}.identity{position:relative;z-index:2;max-width:1080px;margin:auto;display:grid;grid-template-columns:130px 1fr 130px;align-items:center;gap:20px;text-align:center}.logo{width:118px;height:118px;border-radius:50%;background:#fff;padding:7px;margin:auto;object-fit:contain;box-shadow:0 10px 25px #0003}.uni{font-size:22px;font-weight:700;margin:0 0 4px}.college{font-size:25px;font-weight:700;margin:0 0 15px}.title{font-size:42px;line-height:1.25;margin:0;font-weight:800}.year{font-size:20px;font-weight:700;margin:13px 0 0}.wrap{max-width:1180px;margin:auto}.filters,.content{position:relative;background:#fff;border:1px solid #dde5ec;border-radius:26px;padding:27px;box-shadow:0 18px 45px #1c334522}.filters{direction:ltr;margin:-84px 15px 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px;z-index:3}.content{direction:ltr;margin:0 15px 80px;min-height:300px}label{display:block;font-weight:700;margin-bottom:8px}select{width:100%;height:55px;padding:0 12px;border:1px solid #d8e1e8;border-radius:12px;background:#fbfcfd;font:15px "Times New Roman",serif}select:focus{outline:0;border-color:var(--main);box-shadow:0 0 0 3px var(--soft)}select:disabled{background:#f2f4f6}.empty{min-height:245px;display:grid;place-items:center;text-align:center;color:#73808c}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{background:var(--soft);color:var(--main);padding:8px 12px;border-radius:99px;font-weight:700}.files{display:grid;grid-template-columns:225px 1fr;gap:18px;margin-top:20px}.list button{width:100%;padding:16px;text-align:left;border:1px solid #dce4e9;background:#fff;border-radius:13px;margin-bottom:10px;font:16px "Times New Roman",serif}.list button.active{background:var(--soft);border-color:var(--main)}.viewer{border:1px solid #dce4e9;border-radius:14px;overflow:hidden}.bar{padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.bar a{background:var(--main);color:#fff;text-decoration:none;padding:9px 14px;border-radius:9px}iframe{width:100%;height:64vh;min-height:480px;border:0;background:#eef1f4}.unavailable{width:100%;height:64vh;min-height:480px;padding:45px 25px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#f8fafc;border-top:1px solid #e5e7eb;direction:rtl}.unavailable-icon{width:82px;height:82px;display:grid;place-items:center;margin-bottom:20px;border:2px solid var(--main);border-radius:50%;background:var(--soft);font-size:38px}.unavailable h3{margin:0 0 14px;color:var(--main);font-size:29px}.unavailable p{max-width:680px;margin:0;color:#475569;font-size:22px;line-height:1.9}.unavailable strong{color:var(--main)}.unavailable-status{margin-top:22px;padding:10px 20px;border-radius:99px;background:var(--main);color:#fff;font-size:18px;font-weight:700}.checking{min-height:480px;display:grid;place-items:center;color:#64748b;font-size:20px}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.files{grid-template-columns:1fr}}@media(max-width:650px){.identity{grid-template-columns:70px 1fr 70px;gap:7px}.logo{width:66px;height:66px}.uni{font-size:16px}.college{font-size:18px}.title{font-size:27px}.year{font-size:16px}.filters{grid-template-columns:1fr;margin-top:-65px}.unavailable h3{font-size:24px}.unavailable p{font-size:19px}}
</style>
</head>
<body>
<header><div class="identity"><img class="logo" src="faculty_computers_information_logo.png?v=4" alt="شعار كلية الحاسبات والمعلومات"><div><p class="uni">جامعة قناة السويس</p><p class="college">كلية الحاسبات والمعلومات</p><h1 class="title">بوابة نتائج واستبيانات المقررات الدراسية</h1><p class="year">العام الجامعي 2025–2026</p></div><img class="logo" src="suez_canal_university_logo.png?v=4" alt="شعار جامعة قناة السويس"></div></header>
<main class="wrap"><section class="filters"><div><label>Program</label><select id="program"><option value="">Choose program</option></select></div><div><label>Level</label><select id="level" disabled></select></div><div><label>Semester / Group</label><select id="group" disabled></select></div><div><label>Course</label><select id="course" disabled></select></div></section><section class="content"><div id="empty" class="empty"><h2>اختر البرنامج والمستوى والفصل والمقرر لعرض الملفات</h2></div><div id="details" hidden><div class="head"><div><h2 id="title"></h2><span id="code"></span></div><span id="badge" class="badge"></span></div><div class="files"><div id="list" class="list"></div><div class="viewer"><div class="bar"><strong id="ft"></strong><a id="open" target="_blank" rel="noopener noreferrer">فتح ملف PDF</a></div><div id="viewerBody"><iframe id="view" title="معاينة ملف PDF"></iframe></div></div></div></div></section></main>
<script src="data.js"></script>
<script>
const q=x=>document.getElementById(x),P=q('program'),L=q('level'),G=q('group'),C=q('course'),uniq=a=>[...new Set(a)].sort();
function fill(e,a,t){e.innerHTML=`<option value="">${t}</option>`;a.forEach(v=>e.add(new Option(v,v)));e.disabled=false}
function reset(e,t){e.innerHTML=`<option value="">${t}</option>`;e.disabled=true}
function hide(){q('empty').hidden=false;q('details').hidden=true}
fill(P,uniq(COURSES.map(x=>x.program)),'Choose program');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');
P.onchange=()=>{document.body.classList.remove('cs-theme','is-theme');if(P.value==='Computer Science')document.body.classList.add('cs-theme');if(P.value==='Information Systems')document.body.classList.add('is-theme');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(P.value)fill(L,uniq(COURSES.filter(x=>x.program===P.value).map(x=>x.level)),'Choose level')};
L.onchange=()=>{reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(L.value)fill(G,uniq(COURSES.filter(x=>x.program===P.value&&x.level===L.value).map(x=>x.group)),'Choose semester / group')};
G.onchange=()=>{reset(C,'Choose semester first');hide();if(G.value){let a=COURSES.filter(x=>x.program===P.value&&x.level===L.value&&x.group===G.value);C.innerHTML='<option value="">Choose course</option>';a.forEach(x=>C.add(new Option(`${x.code} - ${x.name}`,x.code)));C.disabled=false}};
C.onchange=()=>{if(!C.value)return hide();show(COURSES.find(x=>x.program===P.value&&x.level===L.value&&x.group===G.value&&x.code===C.value))};
function slug(s){return s.toLowerCase().replaceAll(' ','-')}
function show(x){q('empty').hidden=true;q('details').hidden=false;q('title').textContent=x.name;q('code').textContent=x.code;q('badge').textContent=`${x.program} • ${x.level} • ${x.group}`;let root=`pdfs/2025-2026/${slug(x.program)}/${x.code.toLowerCase()}`;q('list').innerHTML='';[['Course Results','course-results.pdf','نتائج المقرر'],['Course Survey','course-survey.pdf','استبيان المقرر']].forEach((f,i)=>{let b=document.createElement('button');b.innerHTML=`<strong>📄 ${f[0]}</strong><br><small>${f[1]}</small>`;b.onclick=()=>openf(root+'/'+f[1],f[0],f[2],b);q('list').appendChild(b);if(!i)openf(root+'/'+f[1],f[0],f[2],b)})}
async function openf(u,t,arabicType,b){document.querySelectorAll('.list button').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('ft').textContent=t;q('open').style.display='none';q('viewerBody').innerHTML='<div class="checking">جارٍ التحقق من توفر الملف...</div>';try{const response=await fetch(u,{method:'HEAD',cache:'no-store'});if(!response.ok)throw new Error('Not found');q('open').href=u;q('open').style.display='inline-block';q('viewerBody').innerHTML=`<iframe id="view" title="${arabicType}" src="${u}#toolbar=1&navpanes=0"></iframe>`}catch(error){q('viewerBody').innerHTML=`<div class="unavailable"><div class="unavailable-icon">📄</div><h3>لا يوجد ${arabicType} للعام الجامعي 2025–2026</h3><p>لم يتم تدريس هذا المقرر خلال العام الجامعي <strong>2025–2026</strong>، ولذلك لا يتوفر ${arabicType} لهذا المقرر.</p><span class="unavailable-status">المقرر لم يُطرح خلال هذا العام</span></div>`}}
</script>
</body>
</html>
