<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة نتائج واستبيانات المقررات الدراسية</title><style>
*{box-sizing:border-box}body{--main:#24344d;--main2:#41546f;--accent:#d7ab32;--soft:#edf1f6;--page:#f4f6fa;margin:0;font-family:"Times New Roman",Times,serif;background:var(--page);color:#1d2939;transition:.3s}body.cs-theme{--main:#087354;--main2:#15936f;--soft:#e8f5f0;--page:#eef8f4}body.is-theme{--main:#126b9c;--main2:#2789b9;--soft:#e6f2fa;--page:#eff7fb}header{position:relative;min-height:380px;padding:28px 20px 130px;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;overflow:hidden;transition:.3s}header:before,header:after{content:"";position:absolute;width:320px;height:320px;border:60px solid rgba(255,255,255,.055);border-radius:50%}header:before{right:-130px;top:-170px}header:after{left:-140px;bottom:-220px}.identity{position:relative;z-index:2;max-width:1080px;margin:auto;display:grid;grid-template-columns:130px 1fr 130px;align-items:center;gap:20px;text-align:center}.logo{width:118px;height:118px;border-radius:50%;background:#fff;padding:7px;margin:auto;object-fit:contain;box-shadow:0 10px 25px #0003}.uni{font-size:22px;font-weight:700;margin:0 0 4px}.college{font-size:25px;font-weight:700;margin:0 0 15px}.title{font-size:42px;line-height:1.25;margin:0;font-weight:800}.year{font-size:20px;font-weight:700;margin:13px 0 0}.wrap{max-width:1180px;margin:auto}.filters,.content{position:relative;background:#fff;border:1px solid #dde5ec;border-radius:26px;padding:27px;box-shadow:0 18px 45px #1c334522}.filters{direction:ltr;margin:-84px 15px 18px;display:grid;grid-template-columns:repeat(5,1fr);gap:15px;z-index:3}.content{direction:ltr;margin:0 15px 80px;min-height:300px}label{display:block;font-weight:700;margin-bottom:8px}select{width:100%;height:55px;padding:0 12px;border:1px solid #d8e1e8;border-radius:12px;background:#fbfcfd;font:15px "Times New Roman",serif}select:focus{outline:0;border-color:var(--main);box-shadow:0 0 0 3px var(--soft)}select:disabled{background:#f2f4f6}.empty{min-height:245px;display:grid;place-items:center;text-align:center;color:#73808c}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{background:var(--soft);color:var(--main);padding:8px 12px;border-radius:99px;font-weight:700}.files{display:grid;grid-template-columns:225px 1fr;gap:18px;margin-top:20px}.list button{width:100%;padding:16px;text-align:left;border:1px solid #dce4e9;background:#fff;border-radius:13px;margin-bottom:10px;font:16px "Times New Roman",serif}.list button.active{background:var(--soft);border-color:var(--main)}.viewer{border:1px solid #dce4e9;border-radius:14px;overflow:hidden}.bar{padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.bar a{background:var(--main);color:#fff;text-decoration:none;padding:9px 14px;border-radius:9px}iframe{width:100%;height:64vh;min-height:480px;border:0;background:#eef1f4}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.files{grid-template-columns:1fr}}@media(max-width:650px){.identity{grid-template-columns:70px 1fr 70px;gap:7px}.logo{width:66px;height:66px}.uni{font-size:16px}.college{font-size:18px}.title{font-size:27px}.year{font-size:16px}.filters{grid-template-columns:1fr;margin-top:-65px}}
.tt{max-width:1150px;margin:25px 15px 80px;background:#fff;padding:24px;border-radius:22px;position:relative;z-index:1;box-shadow:0 15px 35px #0002}.tt h2{text-align:center;color:var(--main)}.ttc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tt select{padding:10px;margin:5px;border-radius:8px}.tt a{display:block;padding:13px;background:var(--soft);color:var(--main);border:1px solid var(--main);border-radius:10px;text-decoration:none;font-weight:bold}.tt iframe{width:100%;height:650px;border:0;margin-top:15px}.ttnote{text-align:center;color:#765b00;background:#fff5c7;padding:10px;border-radius:8px}@media(max-width:700px){.ttc{grid-template-columns:1fr}}</style></head><body><header><div class="identity"><img class="logo" src="faculty_computers_information_logo.png?v=4" alt="شعار كلية الحاسبات والمعلومات"><div><p class="uni">جامعة قناة السويس</p><p class="college">كلية الحاسبات والمعلومات</p><h1 class="title">بوابة نتائج واستبيانات المقررات الدراسية</h1><p class="year">العام الجامعي 2025–2026</p></div><img class="logo" src="suez_canal_university_logo.png?v=4" alt="شعار جامعة قناة السويس"></div></header><main class="wrap"><section class="filters"><div><label>Academic Year</label><select id="academicYear"><option value="">Choose academic year</option><option value="2024-2025">2024-2025</option><option value="2025-2026">2025-2026</option></select></div><div><label>Program</label><select id="program" disabled><option value="">Choose academic year first</option></select></div><div><label>Level</label><select id="level" disabled></select></div><div><label>Semester / Group</label><select id="group" disabled></select></div><div><label>Course</label><select id="course" disabled></select></div></section><section class="content"><div id="empty" class="empty"><h2>اختر العام الجامعي والبرنامج والمستوى والفصل والمقرر لعرض الملفات</h2></div><div id="details" hidden><div class="head"><div><h2 id="title"></h2><span id="code"></span></div><span id="badge" class="badge"></span></div><div class="files"><div id="list" class="list"></div><div class="viewer"><div class="bar"><strong id="ft"></strong><a id="open" target="_blank">فتح ملف PDF</a></div><iframe id="view"></iframe></div></div></div></section><section class="tt"><h2>جداول الامتحانات</h2><p class="ttnote">الجداول المعروضة خاصة بنظام الساعات المعتمدة فقط ولا تشمل اللائحة القديمة.</p><div style="text-align:center"><select id="ty"><option>2025-2026</option><option>2024-2025</option></select><select id="ts"><option value="first-semester">الفصل الدراسي الأول</option><option value="second-semester">الفصل الدراسي الثاني</option></select></div><div id="tc" class="ttc"></div><div id="tv"></div></section></main><script src="data.js"></script><script>
const q=x=>document.getElementById(x),Y=q('academicYear'),P=q('program'),L=q('level'),G=q('group'),C=q('course'),uniq=a=>[...new Set(a)].sort();function fill(e,a,t){e.innerHTML=`<option value="">${t}</option>`;a.forEach(v=>e.add(new Option(v,v)));e.disabled=false}function reset(e,t){e.innerHTML=`<option value="">${t}</option>`;e.disabled=true}function hide(){q('empty').hidden=false;q('details').hidden=true}reset(P,'Choose academic year first');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');Y.onchange=()=>{reset(P,'Choose academic year first');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(Y.value)fill(P,uniq(COURSES.map(x=>x.program)),'Choose program')};P.onchange=()=>{document.body.classList.remove('cs-theme','is-theme');if(P.value==='Computer Science')document.body.classList.add('cs-theme');if(P.value==='Information Systems')document.body.classList.add('is-theme');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(P.value)fill(L,uniq(COURSES.filter(x=>x.program===P.value).map(x=>x.level)),'Choose level')};L.onchange=()=>{reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(L.value)fill(G,uniq(COURSES.filter(x=>x.program===P.value&&x.level===L.value).map(x=>x.group)),'Choose semester / group')};G.onchange=()=>{reset(C,'Choose semester first');hide();if(G.value){let a=COURSES.filter(x=>x.program===P.value&&x.level===L.value&&x.group===G.value);C.innerHTML='<option value="">Choose course</option>';a.forEach(x=>C.add(new Option(`${x.code} - ${x.name}`,x.code)));C.disabled=false}};C.onchange=()=>{if(!C.value)return hide();show(COURSES.find(x=>x.program===P.value&&x.level===L.value&&x.group===G.value&&x.code===C.value))};function slug(s){return s.toLowerCase().replaceAll(' ','-')}function show(x){q('empty').hidden=true;q('details').hidden=false;q('title').textContent=x.name;q('code').textContent=x.code;q('badge').textContent=`${x.program} • ${x.level} • ${x.group}`;let root=`pdfs/${Y.value}/${slug(x.program)}/${x.code.toLowerCase()}`;q('list').innerHTML='';[['Course Results','course-results.pdf'],['Course Survey','course-survey.pdf']].forEach((f,i)=>{let b=document.createElement('button');b.innerHTML=`<strong>📄 ${f[0]}</strong><br><small>${f[1]}</small>`;b.onclick=()=>openf(root+'/'+f[1],f[0],b);q('list').appendChild(b);if(!i)openf(root+'/'+f[1],f[0],b)})}function openf(u,t,b){document.querySelectorAll('.list button').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('ft').textContent=t;q('open').href=u;q('view').src=u+'#toolbar=1&navpanes=0'}
Y.addEventListener('change',()=>{if(typeof ty!=='undefined'&&Y.value){ty.value=Y.value;rt();}});</script><script>const tables=[['first-semester','منتصف الفصل - البرنامج العام','midterm-general.pdf'],['first-semester','منتصف الفصل - علوم الحاسب','midterm-cs.pdf'],['first-semester','منتصف الفصل - نظم المعلومات','midterm-is.pdf'],['first-semester','المنتصف الإلكتروني','electronic.pdf'],['first-semester','العملي والشفوي','practical.pdf'],['first-semester','الامتحانات النهائية','final.pdf'],['second-semester','منتصف الفصل - البرنامج العام','midterm-general.pdf'],['second-semester','منتصف الفصل - علوم الحاسب','midterm-cs.pdf'],['second-semester','منتصف الفصل - نظم المعلومات','midterm-is.pdf'],['second-semester','المنتصف الإلكتروني','electronic.pdf'],['second-semester','العملي والشفوي','practical.pdf'],['second-semester','النهائي - البرامج الخاصة','final-special.pdf']];function rt(){let y=ty.value,t=ts.value;tc.innerHTML='';tv.innerHTML='';tables.filter(x=>x[0]==t).forEach(x=>{let a=document.createElement('a');a.textContent=x[1];let u=`timetables/${y}/${t}/${x[2]}`;a.href=u;a.target='_blank';a.onclick=e=>{e.preventDefault();tv.innerHTML=`<iframe src="${u}#toolbar=1"></iframe>`};tc.appendChild(a)})}ty.onchange=rt;ts.onchange=rt;rt();</script></body></html>
