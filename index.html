<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة نتائج واستبيانات المقررات الدراسية</title>
<style>
*{box-sizing:border-box}body{--main:#087354;--accent:#d5a41e;--soft:#e8f5f0;--page:#eef8f4;margin:0;font-family:"Times New Roman",Times,serif;background:var(--page);color:#173f36;transition:.3s}body.is-theme{--main:#126b9c;--soft:#e6f2fa;--page:#eff7fb}header{position:relative;min-height:390px;padding:30px 22px 130px;color:#fff;background:linear-gradient(135deg,var(--main),color-mix(in srgb,var(--main),white 22%));overflow:hidden}header:before,header:after{content:"";position:absolute;border:60px solid rgba(255,255,255,.055);border-radius:50%;width:330px;height:330px}header:before{right:-130px;top:-170px}header:after{left:-130px;bottom:-210px}.identity{position:relative;z-index:2;max-width:1100px;margin:auto;display:grid;grid-template-columns:135px 1fr 135px;align-items:center;gap:22px;text-align:center}.logo-card{width:122px;height:122px;border-radius:50%;background:#fff;padding:8px;margin:auto;display:flex;align-items:center;justify-content:center;border:4px solid rgba(255,255,255,.8);box-shadow:0 12px 26px rgba(0,0,0,.2)}.logo-card img{width:100%;height:100%;object-fit:contain;border-radius:50%}.uni{font-size:22px;font-weight:700;margin:0 0 5px}.college{font-size:25px;font-weight:700;margin:0 0 17px}.portal-title{font-size:43px;line-height:1.25;margin:0;font-weight:800;text-shadow:0 2px 5px rgba(0,0,0,.18)}.year{font-size:20px;font-weight:700;margin:13px 0 0}.wrap{max-width:1180px;margin:auto}.filters,.content-panel{position:relative;background:#fff;border:1px solid #dbe9e4;border-radius:28px;padding:28px;box-shadow:0 20px 48px rgba(28,79,66,.15)}.filters{direction:ltr;margin:-86px 15px 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px;z-index:3}.content-panel{direction:ltr;margin:0 15px 90px;min-height:310px}.field{direction:ltr}label{display:block;font-size:15px;font-weight:700;margin-bottom:8px;color:#21483f}select{width:100%;height:56px;padding:0 13px;border:1px solid #d5e5df;border-radius:13px;background:#fbfdfc;font-family:"Times New Roman",Times,serif;font-size:15px;color:#173f36;outline:none}select:focus{border-color:var(--main);box-shadow:0 0 0 3px var(--soft)}select:disabled{background:#f3f6f5;color:#8e9996}.empty{min-height:255px;display:grid;place-items:center;text-align:center;color:#758a84}.course-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.course-head h2{font-size:30px;margin:0 0 6px}.badge{padding:9px 13px;border-radius:99px;background:var(--soft);color:var(--main);font-weight:700}.files{display:grid;grid-template-columns:230px 1fr;gap:20px;margin-top:22px}.file-list button{width:100%;padding:17px;text-align:left;border:1px solid #dce9e5;background:#fff;border-radius:14px;margin-bottom:11px;cursor:pointer;font-family:"Times New Roman",Times,serif;font-size:16px;color:#21483f}.file-list button:before{content:"";display:block;width:44px;height:5px;background:var(--accent);border-radius:99px;margin-bottom:10px}.file-list button.active{border-color:var(--main);background:var(--soft)}.viewer{border:1px solid #dce9e5;border-radius:15px;overflow:hidden}.viewerbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.viewerbar a{background:var(--main);color:#fff;text-decoration:none;padding:10px 15px;border-radius:10px;font-weight:700}iframe{width:100%;height:65vh;min-height:500px;border:0;background:#eef2f1}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.files{grid-template-columns:1fr}}@media(max-width:700px){header{min-height:350px;padding-left:8px;padding-right:8px}.identity{grid-template-columns:76px 1fr 76px;gap:7px}.logo-card{width:70px;height:70px}.uni{font-size:16px}.college{font-size:18px}.portal-title{font-size:27px}.year{font-size:16px}.filters{grid-template-columns:1fr;margin-top:-70px}.course-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<header><div class="identity">
<div class="logo-card"><img src="faculty_computers_information_logo.png?v=2" alt="شعار كلية الحاسبات والمعلومات"></div>
<div><p class="uni">جامعة قناة السويس</p><p class="college">كلية الحاسبات والمعلومات</p><h1 class="portal-title">بوابة نتائج واستبيانات المقررات الدراسية</h1><p class="year">العام الجامعي 2025–2026</p></div>
<div class="logo-card"><img src="suez_canal_university_logo.png?v=2" alt="شعار جامعة قناة السويس"></div>
</div></header>
<main class="wrap"><section class="filters">
<div class="field"><label>Program</label><select id="program"><option value="">Choose program</option></select></div>
<div class="field"><label>Level</label><select id="level" disabled></select></div>
<div class="field"><label>Semester / Group</label><select id="group" disabled></select></div>
<div class="field"><label>Course</label><select id="course" disabled></select></div>
</section><section class="content-panel"><div id="empty" class="empty"><h2>اختر البرنامج والمستوى والفصل والمقرر لعرض الملفات</h2></div><div id="content" hidden><div class="course-head"><div><h2 id="title"></h2><span id="subtitle"></span></div><span id="badge" class="badge"></span></div><div class="files"><div id="fileList" class="file-list"></div><div class="viewer"><div class="viewerbar"><strong id="fileTitle"></strong><a id="open" target="_blank">فتح ملف PDF</a></div><iframe id="viewer"></iframe></div></div></div></section></main>
<script src="data.js"></script><script>
const $=id=>document.getElementById(id),P=$('program'),L=$('level'),G=$('group'),C=$('course'),uniq=a=>[...new Set(a)].filter(Boolean).sort();function fill(e,a,t){e.innerHTML=`<option value="">${t}</option>`;a.forEach(v=>e.add(new Option(v,v)));e.disabled=false}function reset(e,t){e.innerHTML=`<option value="">${t}</option>`;e.disabled=true}function hide(){$('empty').hidden=false;$('content').hidden=true}fill(P,uniq(COURSES.map(x=>x.program)),'Choose program');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');P.onchange=()=>{document.body.classList.toggle('is-theme',P.value==='Information Systems');reset(L,'Choose program first');reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(P.value)fill(L,uniq(COURSES.filter(x=>x.program===P.value).map(x=>x.level)),'Choose level')};L.onchange=()=>{reset(G,'Choose level first');reset(C,'Choose semester first');hide();if(L.value)fill(G,uniq(COURSES.filter(x=>x.program===P.value&&x.level===L.value).map(x=>x.group)),'Choose semester / group')};G.onchange=()=>{reset(C,'Choose semester first');hide();if(G.value){let a=COURSES.filter(x=>x.program===P.value&&x.level===L.value&&x.group===G.value);C.innerHTML='<option value="">Choose course</option>';a.forEach(x=>C.add(new Option(`${x.code} - ${x.name}`,x.code)));C.disabled=false}};C.onchange=()=>{if(!C.value)return hide();let x=COURSES.find(x=>x.program===P.value&&x.level===L.value&&x.group===G.value&&x.code===C.value);show(x)};function slug(s){return s.toLowerCase().replaceAll(' ','-')}function show(x){$('empty').hidden=true;$('content').hidden=false;$('title').textContent=x.name;$('subtitle').textContent=x.code;$('badge').textContent=`${x.program} • ${x.level} • ${x.group}`;let root=`pdfs/2025-2026/${slug(x.program)}/${x.code.toLowerCase()}`;$('fileList').innerHTML='';[['Course Results','course-results.pdf'],['Course Survey','course-survey.pdf']].forEach((f,i)=>{let b=document.createElement('button');b.innerHTML=`<strong>📄 ${f[0]}</strong><br><small>${f[1]}</small>`;b.onclick=()=>openf(root+'/'+f[1],f[0],b);$('fileList').appendChild(b);if(!i)openf(root+'/'+f[1],f[0],b)})}function openf(u,t,b){document.querySelectorAll('.file-list button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('fileTitle').textContent=t;$('open').href=u;$('viewer').src=u+'#toolbar=1&navpanes=0'}
</script></body></html>
