<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Files Portal</title><style>
:root{--b:#1d4ed8;--n:#0f172a;--m:#64748b;--l:#e2e8f0;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--n)}header{background:linear-gradient(120deg,#172554,#0369a1);color:#fff;padding:30px 20px}.wrap{max-width:1150px;margin:auto}h1{margin:0 0 8px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin-top:22px;box-shadow:0 5px 18px #0f172a0a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.three{grid-template-columns:repeat(3,1fr)}label{font-size:13px;font-weight:bold}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:7px;background:white}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--b);color:white;font-weight:bold;cursor:pointer}.btn.secondary{background:#334155}.tabs{display:flex;gap:8px}.tabs button{padding:10px 15px;border:1px solid var(--l);background:#fff;border-radius:10px;cursor:pointer}.tabs .active{background:var(--b);color:#fff}.hidden{display:none}.file{border:1px solid var(--l);border-radius:14px;margin:12px 0;overflow:hidden}.filehead{display:flex;justify-content:space-between;align-items:center;padding:13px 15px}.file a{color:var(--b);font-weight:bold;text-decoration:none}iframe{width:100%;height:520px;border:0;background:#f1f5f9}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1e40af;margin-top:14px}.error{background:#fef2f2;color:#991b1b}.muted{color:var(--m);font-size:14px}@media(max-width:760px){.grid,.three{grid-template-columns:1fr}iframe{height:430px}}
</style></head><body><header><div class="wrap"><h1>Course Results & Survey Portal</h1><div>Secure staff access and simple PDF management</div></div></header><main class="wrap">
<section id="login" class="card"><h2>Staff sign in</h2><div class="grid"><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label></div><p><button class="btn" onclick="signIn()">Sign in</button></p><div id="loginMsg"></div></section>
<section id="app" class="hidden"><div class="card"><div class="tabs"><button id="viewTab" class="active" onclick="showTab('view')">View files</button><button id="adminTab" onclick="showTab('admin')">Upload files</button><button class="secondary btn" style="margin-left:auto" onclick="signOut()">Sign out</button></div></div>
<section id="view" class="card"><h2>Find course files</h2><div class="three"><label>Staff member<select id="viewStaff" onchange="loadViewAssignments()"></select></label><label>Course and term<select id="viewAssignment" onchange="loadFiles()"></select></label><label>File type<select id="viewType" onchange="loadFiles()"><option value="">All files</option><option value="course_results">Course results</option><option value="course_survey">Course survey</option><option value="other">Other</option></select></label></div><div id="files"></div></section>
<section id="admin" class="card hidden"><h2>One-step course setup and upload</h2><p class="muted">Enter the staff and course once, choose both PDFs, then upload. Existing staff and courses are reused automatically.</p><div class="three"><label>Staff name<input id="staffName"></label><label>Staff email (optional)<input id="staffEmail" type="email"></label><label>Course code<input id="courseCode" placeholder="CS301"></label><label>Course name<input id="courseName"></label><label>Academic year<input id="year" value="2026-2027"></label><label>Semester<select id="semester"><option>First Semester</option><option>Second Semester</option><option>Summer Semester</option></select></label><label>Course results PDF<input id="resultsPdf" type="file" accept="application/pdf"></label><label>Course survey PDF<input id="surveyPdf" type="file" accept="application/pdf"></label></div><p><button class="btn" onclick="uploadCourse()">Save course and upload selected PDFs</button></p><div id="adminMsg"></div></section></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
let sb;try{sb=supabase.createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabaseAnonKey)}catch(e){document.getElementById('loginMsg').innerHTML='<div class="notice error">Add your Supabase URL and anon key in config.js first.</div>'}
const msg=(id,t,bad=false)=>document.getElementById(id).innerHTML=`<div class="notice ${bad?'error':''}">${t}</div>`;
async function init(){if(!sb)return;const {data}=await sb.auth.getSession();setSession(data.session)}
function setSession(s){document.getElementById('login').classList.toggle('hidden',!!s);document.getElementById('app').classList.toggle('hidden',!s);if(s)loadStaff()}
async function signIn(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg('loginMsg',error.message,true);else setSession(true)}async function signOut(){await sb.auth.signOut();setSession(false)}
function showTab(t){view.classList.toggle('hidden',t!=='view');admin.classList.toggle('hidden',t!=='admin');viewTab.classList.toggle('active',t==='view');adminTab.classList.toggle('active',t==='admin')}
async function loadStaff(){const {data}=await sb.from('staff').select('*').order('full_name');viewStaff.innerHTML='<option value="">Choose staff member</option>';(data||[]).forEach(x=>viewStaff.add(new Option(x.full_name,x.id)))}
async function loadViewAssignments(){viewAssignment.innerHTML='<option value="">Choose course</option>';files.innerHTML='';if(!viewStaff.value)return;const {data}=await sb.from('staff_courses').select('id,academic_year,semester,courses(course_code,course_name)').eq('staff_id',viewStaff.value);(data||[]).forEach(x=>viewAssignment.add(new Option(`${x.courses.course_code||''} ${x.courses.course_name} | ${x.academic_year} | ${x.semester}`,x.id)))}
async function loadFiles(){files.innerHTML='';if(!viewAssignment.value)return;let q=sb.from('course_files').select('*').eq('assignment_id',viewAssignment.value).order('created_at');if(viewType.value)q=q.eq('file_type',viewType.value);const {data,error}=await q;if(error)return msg('files',error.message,true);for(const f of data||[]){const {data:signed}=await sb.storage.from('course-files').createSignedUrl(f.storage_path,3600);files.innerHTML+=`<div class="file"><div class="filehead"><div><b>${f.display_name}</b><div class="muted">${f.file_type.replace('_',' ')}</div></div><a target="_blank" href="${signed.signedUrl}">Open PDF</a></div><iframe src="${signed.signedUrl}#toolbar=1"></iframe></div>`}if(!(data||[]).length)files.innerHTML='<p class="muted">No files uploaded for this selection.</p>'}
async function uploadCourse(){try{if(!staffName.value||!courseName.value)throw Error('Staff name and course name are required.');if(!resultsPdf.files[0]&&!surveyPdf.files[0])throw Error('Choose at least one PDF.');msg('adminMsg','Uploading...');let {data:s,error}=await sb.from('staff').select().eq('full_name',staffName.value.trim()).maybeSingle();if(error)throw error;if(!s){({data:s,error}=await sb.from('staff').insert({full_name:staffName.value.trim(),email:staffEmail.value||null}).select().single());if(error)throw error}let {data:c}=await sb.from('courses').select().eq('course_name',courseName.value.trim()).maybeSingle();if(!c){({data:c,error}=await sb.from('courses').insert({course_code:courseCode.value||null,course_name:courseName.value.trim()}).select().single());if(error)throw error}let {data:a}=await sb.from('staff_courses').select().eq('staff_id',s.id).eq('course_id',c.id).eq('academic_year',year.value).eq('semester',semester.value).maybeSingle();if(!a){({data:a,error}=await sb.from('staff_courses').insert({staff_id:s.id,course_id:c.id,academic_year:year.value,semester:semester.value}).select().single());if(error)throw error}for(const [type,file] of [['course_results',resultsPdf.files[0]],['course_survey',surveyPdf.files[0]]]){if(!file)continue;const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${year.value}/${a.id}/${Date.now()}-${type}-${safe}`;({error}=await sb.storage.from('course-files').upload(path,file));if(error)throw error;({error}=await sb.from('course_files').insert({assignment_id:a.id,file_type:type,display_name:file.name,storage_path:path}));if(error)throw error}msg('adminMsg','Course and selected PDFs uploaded successfully.');resultsPdf.value='';surveyPdf.value='';await loadStaff()}catch(e){msg('adminMsg',e.message,true)}}init();
</script></body></html>
